<rect x="165" y="210" rx="10" ry="10" width="64" height="20" fill="#eaeef2"/><text x="197.0" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#24292f">FastAPI</text>
<rect x="237" y="210" rx="10" ry="10" width="51" height="20" fill="#eaeef2"/><text x="262.5" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#24292f">React</text>
<rect x="296" y="210" rx="10" ry="10" width="70" height="20" fill="#eaeef2"/><text x="331.0" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#24292f">Electron</text>
