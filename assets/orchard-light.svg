<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Orchard">
<rect x="0.5" y="0.5" width="559" height="249" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="0" y="0" width="6" height="250" rx="3" fill="#6366f1"/>
<circle cx="34" cy="36" r="6" fill="#6366f1"/>
<text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Orchard</text>
<text x="28" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Distributed LLM inference across the Apple devices you already own.</text>
<text x="28" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Splits a model&#x27;s transformer layers across Macs, iPads and iPhones and</text>
<text x="28" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">streams hidden states between them, with a KV cache, a cluster</text>
<text x="28" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">manager, and a desktop app on top. Top 10% of YC applicants.</text>
<rect x="28" y="210" rx="10" ry="10" width="57" height="20" fill="#eaeef2"/><text x="56.5" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#24292f">Python</text>
