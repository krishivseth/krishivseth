<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Watchman">
<rect x="0.5" y="0.5" width="559" height="249" rx="12" fill="#161b22" stroke="#30363d"/>
<rect x="0" y="0" width="6" height="250" rx="3" fill="#f59e0b"/>
<circle cx="34" cy="36" r="6" fill="#f59e0b"/>
<text x="50" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Watchman</text>
<text x="28" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">Turns a fleet of security cameras into a live feed you can question in</text>
<text x="28" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">plain English. Continuously indexes footage and answers questions like</text>
<text x="28" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">&quot;was anyone at the door in the last few minutes?&quot; with the matching</text>
<text x="28" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">frames.</text>
<rect x="28" y="210" rx="10" ry="10" width="84" height="20" fill="#21262d"/><text x="70.0" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c9d1d9">TypeScript</text>
<rect x="120" y="210" rx="10" ry="10" width="90" height="20" fill="#21262d"/><text x="165.0" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c9d1d9">SpacetimeDB</text>
<rect x="218" y="210" rx="10" ry="10" width="57" height="20" fill="#21262d"/><text x="246.5" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c9d1d9">Gemini</text>
</svg>